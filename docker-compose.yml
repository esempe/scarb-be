  # PostgreSQL база данных
  postgres:
    image: postgres:16-alpine
    container_name: scarb-be-postgres
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=scarb_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - scarb-network

volumes:
  postgres_data:

networks:
  scarb-network:
    driver: bridge
